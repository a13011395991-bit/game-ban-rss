name: 自动抓取封号公告
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 运行爬虫抓取公告
        run: python scraper.py

      - name: 保存并更新RSS文件
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Bot"
          git add ban-notice.rss
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新公告" && git push)
